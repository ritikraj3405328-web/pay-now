<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Leads | Live ₹1 Test Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
        }
    </style>

    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen py-8 px-4 flex flex-col items-center justify-start space-y-6">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 z-50 transform -translate-y-24 opacity-0 transition-all duration-300 pointer-events-none bg-emerald-500 text-white font-medium py-3 px-6 rounded-full shadow-2xl flex items-center space-x-2">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toast-msg">Copied!</span>
    </div>

    <!-- Main Payment & Onboarding Card -->
    <div class="max-w-md w-full glass-card border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
        
        <!-- App Header -->
        <div class="text-center space-y-1">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <i class="fa-solid fa-flask text-xs"></i> Live Testing Mode Enabled
            </span>
            <h1 class="text-2xl font-extrabold text-white tracking-tight">Auto Leads Test Gateway</h1>
            <p class="text-sm text-slate-400">&#8377;1 Pay karke live system test karein</p>
        </div>

        <!-- Step 1: Payment Module -->
        <div class="bg-slate-900/90 rounded-2xl p-5 border border-slate-800 space-y-4">
            <div class="flex items-center justify-between">
                <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Step 1: Test Payment</span>
                <span class="text-xs font-semibold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">&#8377;1 Only</span>
            </div>

            <!-- QR Code Container -->
            <div class="flex flex-col items-center justify-center bg-white p-3 rounded-2xl w-44 h-44 mx-auto shadow-inner" id="qrcode"></div>

            <!-- Pay Now Intent Button -->
            <a href="upi://pay?pa=9661692365@ybl&pn=Prem%20Raj&am=1" 
               class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 active:scale-[0.99] text-white py-3.5 px-4 rounded-xl font-bold shadow-lg shadow-emerald-600/30 transition-all text-center">
                <i class="fa-solid fa-shield-halved"></i>
                Pay &#8377;1 Test Now (PhonePe/GPay)
            </a>

            <!-- Copy UPI ID -->
            <button onclick="copyUpi()" type="button" class="w-full text-center text-xs text-slate-400 hover:text-white transition flex items-center justify-center gap-1.5">
                UPI ID: <span class="text-slate-300 font-mono font-medium">9661692365@ybl</span>
                <i class="fa-regular fa-copy"></i>
            </button>
        </div>

        <!-- Step 2: Customer Onboarding & Verification Form -->
        <form id="onboardingForm" class="space-y-4">
            <div class="flex items-center justify-between">
                <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Step 2: Enter Details & UTR</span>
                <span class="text-[11px] text-blue-400 flex items-center gap-1">
                    <i class="fa-solid fa-bolt"></i> Instant Firebase Sync
                </span>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Aapka Naam</label>
                <input type="text" id="custName" required placeholder="eg. Ritik Raj" 
                       class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">WhatsApp Number</label>
                <input type="tel" id="custPhone" required maxlength="10" placeholder="10-digit mobile number" 
                       class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Business / Service</label>
                <input type="text" id="custBusiness" required placeholder="eg. Electronics / Agency" 
                       class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">&#8377;1 Payment ka 12-Digit UTR Number</label>
                <input type="text" id="custUtr" required maxlength="12" minlength="12" placeholder="eg. 629522830727" 
                       class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm font-mono tracking-wider text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
            </div>

            <button type="submit" id="submitBtn"
                    class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.99] text-white py-3.5 px-4 rounded-xl font-bold shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                Verify & Save Record
            </button>
        </form>
    </div>

    <!-- Live Transaction History Section (Instant Proof) -->
    <div class="max-w-md w-full glass-card border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-4">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <h2 class="text-sm font-bold text-slate-200 flex items-center gap-2">
                <i class="fa-solid fa-clock-rotate-left text-emerald-400"></i>
                Live Database History
            </h2>
            <span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full font-mono" id="recordCount">Loading...</span>
        </div>

        <div id="historyList" class="space-y-3 max-h-72 overflow-y-auto pr-1">
            <div class="text-center py-6 text-xs text-slate-500">
                <i class="fa-solid fa-circle-notch fa-spin text-base mb-1"></i><br>
                Fetching live transactions from Firebase...
            </div>
        </div>
    </div>

    <script>
        // 1. Firebase Initialize
        const firebaseConfig = {
            apiKey: "AIzaSyAa7lt4jyDSVpxlNq5pp3RYZ8K1i8tr86A",
            authDomain: "auto-leads-ce2cb.firebaseapp.com",
            projectId: "auto-leads-ce2cb",
            storageBucket: "auto-leads-ce2cb.firebasestorage.app",
            messagingSenderId: "749840204236",
            appId: "1:749840204236:web:ecce44bc95aecd4a041d69"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 2. Generate ₹1 QR Code
        const upiUrl = "upi://pay?pa=9661692365@ybl&pn=Prem%20Raj&am=1";
        new QRCode(document.getElementById("qrcode"), {
            text: upiUrl,
            width: 150,
            height: 150,
            colorDark : "#0f172a",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.M
        });

        // 3. Copy UPI function
        function copyUpi() {
            navigator.clipboard.writeText("9661692365@ybl");
            const toast = document.getElementById("toast");
            document.getElementById("toast-msg").innerText = "UPI ID Copied!";
            toast.classList.remove("-translate-y-24", "opacity-0");
            setTimeout(() => toast.classList.add("-translate-y-24", "opacity-0"), 2500);
        }

        // 4. Realtime Firestore Listener (Loads History Automatically)
        db.collection("subscribers").orderBy("createdAt", "desc").limit(10)
          .onSnapshot((snapshot) => {
              const listContainer = document.getElementById("historyList");
              document.getElementById("recordCount").innerText = `${snapshot.size} Entries`;

              if (snapshot.empty) {
                  listContainer.innerHTML = `<div class="text-center py-6 text-xs text-slate-500">Abhi tak koi transaction record nahi hua hai.</div>`;
                  return;
              }

              let html = "";
              snapshot.forEach((doc) => {
                  const data = doc.data();
                  const time = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}) : "Just now";
                  
                  html += `
                  <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3 text-xs space-y-1.5 transition-all hover:border-slate-700">
                      <div class="flex items-center justify-between">
                          <span class="font-bold text-white text-sm">${data.name || 'Anonymous'}</span>
                          <span class="font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">&#8377;${data.amount || 1}</span>
                      </div>
                      <div class="grid grid-cols-2 gap-1 text-slate-400 text-[11px]">
                          <div><i class="fa-solid fa-phone text-[10px] mr-1"></i>${data.phone}</div>
                          <div><i class="fa-solid fa-briefcase text-[10px] mr-1"></i>${data.business || 'N/A'}</div>
                      </div>
                      <div class="flex items-center justify-between text-[11px] pt-1 border-t border-slate-800/80">
                          <span class="font-mono text-slate-300">UTR: <span class="text-blue-400">${data.utr}</span></span>
                          <span class="text-slate-500 text-[10px]">${time}</span>
                      </div>
                  </div>
                  `;
              });
              listContainer.innerHTML = html;
          }, (error) => {
              console.error("Error loading history: ", error);
              document.getElementById("historyList").innerHTML = `<div class="text-center py-4 text-xs text-rose-400">History sync error: ${error.message}</div>`;
          });

        // 5. Form Submit Handler
        document.getElementById("onboardingForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Verifying & Storing...`;

            const name = document.getElementById("custName").value.trim();
            const phone = document.getElementById("custPhone").value.trim();
            const business = document.getElementById("custBusiness").value.trim();
            const utr = document.getElementById("custUtr").value.trim();

            if (utr.length !== 12 || isNaN(utr)) {
                alert("Kripya 12-digit ka sahi UTR number daalein.");
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Verify & Save Record`;
                return;
            }

            try {
                // Save to Firestore
                await db.collection("subscribers").add({
                    name: name,
                    phone: phone,
                    business: business,
                    utr: utr,
                    amount: 1,
                    status: "Verified Test Record",
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Clear input fields
                document.getElementById("custUtr").value = "";

                // Show success toast
                const toast = document.getElementById("toast");
                document.getElementById("toast-msg").innerText = "Success! Record Saved to Database.";
                toast.classList.remove("-translate-y-24", "opacity-0");
                setTimeout(() => toast.classList.add("-translate-y-24", "opacity-0"), 3000);

                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i> Record Added!`;
                setTimeout(() => {
                    btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Verify & Save Record`;
                }, 2000);

            } catch (error) {
                console.error("Database Error: ", error);
                alert("Database save error: " + error.message);
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Verify & Save Record`;
            }
        });
    </script>
</body>
</html>
